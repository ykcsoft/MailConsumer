name: MailConsumer - Docker Image CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish_images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push MailConsumer
        uses: docker/build-push-action@v6
        with:
          context: ./MailConsumerRabbitMQ
          file: ./MailConsumerRabbitMQ/Dockerfile
          push: true
          tags: |
            ghcr.io/ykcsoft/consumermail:latest
            ghcr.io/ykcsoft/consumermail:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
